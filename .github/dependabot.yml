version: 2

# One grouped PR per ecosystem per month for minor and patch releases.
# Major versions are skipped here and upgraded deliberately, since they need
# migration work. Security alerts still flag any vulnerable version.
updates:
  # Python production dependencies
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - python
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Node frontend dependencies
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - javascript
    groups:
      javascript:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker base images
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot treats 3.11 -> 3.12+ as a minor bump, but the pinned
      # pandas 2.0 has no wheels for Python 3.12+; move them together.
      - dependency-name: "python"
        versions: [">=3.12"]

  # GitHub Actions (CI only, so major versions are included)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns: ["*"]
